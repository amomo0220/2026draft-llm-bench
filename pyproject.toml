[project]
name = "draft-llm-bench"
license = "MIT"
version = "0.1.0"
description = "2026プロ野球ドラフト × LLM／AIエージェント ライブ予測ベンチマーク"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.30.1",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
